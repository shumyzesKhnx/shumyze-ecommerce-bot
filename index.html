
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMate - Customer Support</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #F5EFF2;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: #F5EFF2;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #382B43;
            color: white;
            padding: 22px;
        }

        .header h2 {
            margin: 0 0 5px;
        }

        #status {
            font-size: 13px;
            color: #C5AEBB;
            margin-top: 5px;
        }

        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #F5EFF2;
        }

        .message {
            padding: 11px 14px;
            margin-bottom: 14px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.5;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .user {
            background: #806477;
            color: white;
            margin-left: auto;
            white-space: pre-wrap;
        }

        .bot {
            background: #E8DDE4;
            color: #382B43;
            margin-right: auto;
        }

        .bot p {
            margin: 0 0 10px;
        }

        .bot p:last-child {
            margin-bottom: 0;
        }

        .bot ul, .bot ol {
            margin-top: 5px;
            margin-bottom: 10px;
            padding-left: 25px;
        }

        .bot li {
            margin-bottom: 5px;
        }

        .bot strong {
            font-weight: bold;
        }

        .bot code {
            background: #DCD0D9;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #D8C9D2;
            gap: 10px;
            background: #FFFFFF;
        }

        #message-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #C5AEBB;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            color: #382B43;
            background: #FFFFFF;
        }

        #message-input:focus {
            border-color: #806477;
            box-shadow: 0 0 0 2px rgba(128, 100, 119, 0.15);
        }

        #message-input::placeholder {
            color: #9B8995;
        }

        button {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #806477;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            transition: background 0.2s ease;
            flex-shrink: 0;
        }

        button:hover {
            background: #382B43;
        }

        button:disabled {
            background: #C5AEBB;
            cursor: not-allowed;
        }

        button svg {
            width: 22px;
            height: 22px;
        }

    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h2>ShopMate</h2>
        <div>Your E-Commerce Customer Support Assistant</div>
        <div id="status">Connecting...</div>
    </div>

    <div id="chat-box">
        <div class="message bot">
            Hello! Welcome to ShopMate. How can I help you today?
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="message-input"
            placeholder="Type your message..."
        >

        <button id="send-button" disabled aria-label="Send message" title="Send message">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
            <path d="M5 12h14"/>
            <path d="m12 5 7 7-7 7"/>
            </svg>
        </button>
    </div>

</div>

<script>

    const chatBox = document.getElementById("chat-box");
    const input = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");
    const statusText = document.getElementById("status");

    let socket;
    let currentBotMessage = null;
    let waitingForResponse = false;

    // Convert basic Markdown to HTML safely
    function renderMarkdown(text) {

        // Escape HTML to prevent unsafe HTML rendering
        text = text.replace(/&/g, "&amp;")
                   .replace(/</g, "&lt;")
                   .replace(/>/g, "&gt;")
                   .replace(/"/g, "&quot;")
                   .replace(/'/g, "&#39;");

        // Format inline code
        text = text.replace(/`([^`]+)`/g, "<code>$1</code>");

        // Format bold
        text = text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
        text = text.replace(/__(.*?)__/g, "<strong>$1</strong>");

        // Format italic
        text = text.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        text = text.replace(/_([^_]+)_/g, "<em>$1</em>");

        // Split into lines
        const lines = text.split("\n");
        let html = "";
        let inList = false;

        for (let line of lines) {

            // Bullet list items
            if (/^\s*[-*]\s+/.test(line)) {

                if (!inList) {
                    html += "<ul>";
                    inList = true;
                }

                line = line.replace(/^\s*[-*]\s+/, "");
                html += "<li>" + line + "</li>";

            }

            // Close list when a non-list line appears
            else {

                if (inList) {
                    html += "</ul>";
                    inList = false;
                }

                if (line.trim() !== "") {
                    html += "<p>" + line + "</p>";
                }

            }

        }

        // Close a list at the end
        if (inList) {
            html += "</ul>";
        }

        return html;
    }


    function connectWebSocket() {

        const protocol =
            window.location.protocol === "https:" ? "wss:" : "ws:";

        socket = new WebSocket(
            `${protocol}//${window.location.host}/ws/chat`
        );

        socket.onopen = function () {
            statusText.textContent = "Ready to assist you!";
            sendButton.disabled = false;
        };

        socket.onmessage = function (event) {

            const data = JSON.parse(event.data);

            if (data.type === "token") {

                if (currentBotMessage) {

                    currentBotMessage.dataset.rawText += data.content;

                    currentBotMessage.innerHTML =
                        renderMarkdown(currentBotMessage.dataset.rawText);

                    chatBox.scrollTop = chatBox.scrollHeight;
                }

            }

            if (data.type === "done") {

                waitingForResponse = false;
                currentBotMessage = null;
                sendButton.disabled = false;
                input.focus();

            }

        };

        socket.onclose = function () {
            statusText.textContent = "Offline";
            sendButton.disabled = true;
        };

        socket.onerror = function () {
            statusText.textContent = "Connection unavailable";
        };

    }


    function sendMessage() {

        const message = input.value.trim();

        if (
            !message ||
            !socket ||
            socket.readyState !== WebSocket.OPEN ||
            waitingForResponse
        ) {
            return;
        }

        const userMessage = document.createElement("div");
        userMessage.className = "message user";
        userMessage.textContent = message;
        chatBox.appendChild(userMessage);

        currentBotMessage = document.createElement("div");
        currentBotMessage.className = "message bot";
        currentBotMessage.dataset.rawText = "";
        chatBox.appendChild(currentBotMessage);

        socket.send(message);

        input.value = "";
        waitingForResponse = true;
        sendButton.disabled = true;

        chatBox.scrollTop = chatBox.scrollHeight;

    }


    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function (event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });

    connectWebSocket();

</script>

</body>
</html>
